[pytest]
# Không có dòng này thì `pytest tests/ -v` (lệnh ghi trong CLAUDE.md) báo
# ModuleNotFoundError: No module named 'src' — chỉ `python -m pytest` mới chạy được.
pythonpath = .
testpaths = tests
# Test `llm` gọi Claude API thật nên mặc định BỊ BỎ QUA — `pytest tests/ -v` không được
# âm thầm tiêu tiền. `-m llm` trên dòng lệnh ghi đè dòng này (`-m` là option đơn giá
# trị, lần xuất hiện sau thắng).
addopts = -m "not llm"
markers =
    slow: cần nạp model sentence-transformers (~470MB), chạy chậm
    llm: gọi Claude API thật, TỐN TIỀN — chạy bằng `pytest tests/test_generation.py -m llm -v`
